<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>New class · Teacher Mary</title>
<meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/teacher.css">
<script src="/app.js"></script><script src="/teacher-common.js"></script>
</head><body>
<main id="app"><p class="muted">Loading…</p></main>
<script>
(function () {
  var h = TMT.h;
  TMT.header('New class');
  var app = document.getElementById('app');
  var DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  var ORDER = [1, 2, 3, 4, 5, 6, 0];
  var S = { name: '', days: {}, add: [], addDraft: '', multi: false, busy: false, result: null };

  function addName() {
    var n = S.addDraft.trim();
    if (!n) return;
    S.add.push(n); S.addDraft = ''; draw();
    var i = document.getElementById('addname'); if (i) i.focus();
  }
  function section(num, title, body) {
    return h('section', { class: 'card flat' }, [h('h2', { style: 'font-size:22px' }, num + '. ' + title)].concat(body));
  }

  function draw() {
    app.innerHTML = '';
    if (S.result) return drawDone();
    app.appendChild(h('div', {}, [h('h1', { style: 'font-size:36px' }, 'New class'),
      h('p', { class: 'muted', style: 'margin:6px 0 0' }, 'Set the weekly days once. Lessons are created for you as you go, and the class keeps one link for good.')]));

    app.appendChild(section(1, 'Class name', [
      h('input', { type: 'text', id: 'classname', placeholder: 'e.g. Class A', maxlength: 40, value: S.name, oninput: function (e) { S.name = e.target.value; refreshBtn(); } }),
    ]));

    app.appendChild(section(2, 'Which days does it meet?', [
      h('div', { class: 'chips' }, ORDER.map(function (d) {
        var on = S.days[d] !== undefined;
        return h('button', { class: 'chip' + (on ? ' on' : ''), type: 'button', 'data-dow': d, onclick: function () {
          if (on) delete S.days[d]; else S.days[d] = '19:00'; draw();
        } }, DAYS[d]);
      })),
      h('div', { class: 'list' }, ORDER.filter(function (d) { return S.days[d] !== undefined; }).map(function (d) {
        return h('div', { class: 'row' }, [h('b', { style: 'width:48px' }, DAYS[d]), h('span', { class: 'muted' }, 'starts at'),
          h('input', { type: 'text', 'data-time': d, value: S.days[d], placeholder: '19:00', maxlength: 5, style: 'width:90px', oninput: function (e) { S.days[d] = e.target.value; } })]);
      })),
      h('span', { class: 'muted' }, 'Like a calendar: pick every day the class meets (for example Tue and Sat). Times are 24-hour, e.g. 19:00. You can skip a day later by deleting that lesson.'),
    ]));

    var rows = S.add.map(function (n, i) {
      return h('div', { class: 'item', 'data-student': n }, [h('span', {}, n), h('button', { class: 'btn small danger', type: 'button', onclick: function () { S.add.splice(i, 1); draw(); } }, 'Remove')]);
    });
    app.appendChild(section(3, 'Who is in the class?', [
      h('div', { class: 'list' }, rows),
      h('div', { class: 'row' }, [
        h('input', { type: 'text', id: 'addname', placeholder: 'Add a student, e.g. Linh T.', maxlength: 40, value: S.addDraft,
          oninput: function (e) { S.addDraft = e.target.value; }, onkeydown: function (e) { if (e.key === 'Enter') { e.preventDefault(); addName(); } } }),
        h('button', { class: 'btn', type: 'button', id: 'addbtn', onclick: addName }, 'Add'),
      ]),
      h('span', { class: 'muted' }, 'Tip: first name and last initial keeps things private. You can add or remove students any time.'),
    ]));

    app.appendChild(section(4, 'Homework', [
      h('label', { class: 'row', style: 'gap:8px' }, [
        h('input', { type: 'checkbox', id: 'multi', checked: S.multi ? true : null, onchange: function (e) { S.multi = e.target.checked; } }),
        'Let students hand in several files for one lesson (up to 10)',
      ]),
      h('span', { class: 'muted' }, 'Off: a new file replaces the old one. You can change this later.'),
    ]));

    app.appendChild(h('div', { class: 'row' }, [
      h('button', { class: 'btn green', id: 'create', type: 'button', onclick: create }, 'Create class and link'),
      h('span', { class: 'muted', id: 'progress' }, ''),
    ]));
    refreshBtn();
  }
  function refreshBtn() {
    var b = document.getElementById('create'); if (b) b.disabled = S.busy || !S.name.trim();
  }

  function create() {
    S.busy = true; refreshBtn();
    var schedule = ORDER.filter(function (d) { return S.days[d] !== undefined; }).map(function (d) { return { dow: d, time: String(S.days[d] || '').trim() }; });
    TM.api('/api/teacher/classes', { method: 'POST', body: { name: S.name.trim(), students: S.add, schedule: schedule, multi: S.multi } }).then(function (c) {
      S.result = c; S.busy = false; draw();
    }).catch(function (e) { S.busy = false; refreshBtn(); TMT.fail(e); });
  }

  function drawDone() {
    var r = S.result;
    app.appendChild(h('section', { class: 'card flat', id: 'done' }, [
      h('h1', { style: 'font-size:34px' }, 'Your class link is ready'),
      h('span', { class: 'muted' }, 'This link stays the same for every lesson. ' + (r.lessonsCreated ? r.lessonsCreated + ' lessons were created for the next two weeks.' : 'Add lessons from the class page.')),
      h('div', { class: 'link', id: 'newlink' }, TM.absUrl(r.link)),
      h('div', { class: 'row' }, [
        TMT.copyBtn(r.link, 'Copy link'),
        h('a', { class: 'btn ghost', href: '/teacher/class/?id=' + r.id }, 'Open class and add reading'),
      ]),
    ]));
  }
  draw();
})();
</script></body></html>
